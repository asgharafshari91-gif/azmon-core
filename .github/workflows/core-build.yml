name: Core build and release identity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 commit
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libboost-dev libevent-dev libsqlite3-dev python3
      - run: AZMON_JOBS=2 bash scripts/build.sh
      - run: python3 scripts/check_release.py
